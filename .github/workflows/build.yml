name: 🚀 Build & Release Sylheti Translator

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 3.1.1)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      # ── 2. Java Setup ─────────────────────────────────────────────
      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle Permission ──────────────────────────────────────
      - name: 🔧 Grant Gradle permission
        run: chmod +x gradlew

      # ── 4. Decode Keystore ────────────────────────────────────────
      - name: 🔑 Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/android.keystore

      # ── 5. Build Debug APK ────────────────────────────────────────
      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug

      # ── 6. Build Release APK ──────────────────────────────────────
      - name: 🏗️ Build Release APK
        run: ./gradlew assembleRelease
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── 7. Build Release AAB (Play Store) ─────────────────────────
      - name: 📦 Build Release AAB
        run: ./gradlew bundleRelease
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── 8. Upload Debug APK ───────────────────────────────────────
      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 9. Upload Release APK ─────────────────────────────────────
      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── 10. Upload Release AAB ────────────────────────────────────
      - name: 📤 Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── 11. Build Summary ─────────────────────────────────────────
      - name: ✅ Build Summary
        run: |
          echo "## 🎉 Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Path |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔨 Debug APK | app/build/outputs/apk/debug/ |" >> $GITHUB_STEP_SUMMARY
          echo "| 📱 Release APK | app/build/outputs/apk/release/ |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏪 Release AAB | app/build/outputs/bundle/release/ |" >> $GITHUB_STEP_SUMMARY
