name: Build Sylheti Translator

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'What to build?'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Gradle permission
        run: chmod +x gradlew

      # Get version from build.gradle
      - name: Get Version
        id: version
        run: |
          VERSION=$(grep versionName app/build.gradle | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # ── Debug ─────────────────────────────────────────────────────
      - name: Build Debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        if: inputs.build_type == 'debug' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # ── Release ───────────────────────────────────────────────────
      - name: Create keystore dir
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: mkdir -p app/keystore

      - name: Decode Keystore
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/android.keystore

      - name: Build Release APK
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: ./gradlew assembleRelease --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Build Release AAB
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        run: ./gradlew bundleRelease --stacktrace
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Release APK
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-v${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: release-aab-v${{ steps.version.outputs.version }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Create GitHub Release
        if: inputs.build_type == 'release' || inputs.build_type == 'both'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}-${{ github.run_number }}
          name: Sylheti Translator v${{ steps.version.outputs.version }}
          body: Sylheti Translator v${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "## Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "| File | Type |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| debug-apk | Testing |" >> $GITHUB_STEP_SUMMARY
          echo "| release-apk | Direct Install |" >> $GITHUB_STEP_SUMMARY
          echo "| release-aab | Play Store |" >> $GITHUB_STEP_SUMMARY
